[package]
name = "fm1-grid-app"
version = "0.1.0"
edition = "2021"
description = "The FM-1 emulator grid UI and state"
license = "MIT"

[dependencies]
fm1-performer = { path = "../fm1-performer" }
fm1-recovery = { path = "../fm1-recovery" }
gpui-kit = "=0.8.0"
image = "0.25"
rfd = "0.17.2"
cpal = "0.18.2"
hqx = "0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
fm1-soc = { git = "https://github.com/joakimeriksson/fm1-emu.git", rev = "a0e9a88cba72a6de7368273c82e26867848e281d" }

[build-dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = "3"

[dev-dependencies]
gpui-kit = { version = "=0.8.0", features = ["test-support"] }
