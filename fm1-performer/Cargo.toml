[package]
name = "fm1-performer"
version = "0.1.0"
edition = "2021"
description = "The UI-free FM-1 core: emulator client, USB/MIDI hardware, MIDI graph and clock, firmware library and on-disk store"
license = "MIT"

[dependencies]
# MIDI ports for the live USB devices (hardware.rs)
midir = "0.11.1"
# Optional per-emulator core pinning on Linux
libc = "0.2"
# The FM-1 CPU/SoC from the fm1-emu project. Pinned so the app keeps building even if
# upstream changes; bump the pin deliberately. `fm1-core` and `fm1-soc` are found inside
# the fm1-emu workspace.
fm1-core = { git = "https://github.com/joakimeriksson/fm1-emu.git", rev = "40780288c0b010c387ee81fd34a6bfc64df9aced" }
fm1-soc = { git = "https://github.com/joakimeriksson/fm1-emu.git", rev = "40780288c0b010c387ee81fd34a6bfc64df9aced" }
# On-disk state (src/store.rs): objects as JSON, blobs as bytes.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Some firmware downloads come zip-wrapped; installing pulls the .fwsc member out
# (src/firmware_picker.rs). Pure-Rust backend only, same as the lock already carries.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
directories = "6"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Hub catalog + firmware package downloads (src/library.rs); ureq has no wasm32 build.
# (Tried default-features = false + native-tls to drop rustls/ring: ureq's shortcut
# calls never pick up native-tls without a custom AgentBuilder, and the measured
# clean-build gain was noise (~0.1s of 9.5s on 16 cores). Not worth the code.)
ureq = "2"

# The store's wasm32 branch uses the browser's localStorage instead.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Storage", "Window"] }

[build-dependencies]
# build.rs parses firmware/firmwares.json, the single source for the embedded list.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# build.rs also downloads the gitignored .fwsc packages missing from a fresh clone and
# verifies them against the recorded SHA-256 hashes.
ureq = "3"
sha2 = "0.10"
