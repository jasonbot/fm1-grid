# One-off firmware downloader; not part of the main fm1-grid build.
# Run from the repo root: cargo run --manifest-path firmware/download/Cargo.toml
[package]
name = "firmware-download"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "firmware-download"
path = "main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "3"

# Keep this crate out of the parent package's implicit workspace.
[workspace]
