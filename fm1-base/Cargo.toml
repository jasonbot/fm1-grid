[package]
name = "fm1-base"
version = "0.1.0"
edition = "2021"
description = "Shared clock, MIDI routing and on-disk store for fm1-grid and fm1-tty"
license = "MIT"

[dependencies]
midir = "0.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
fm1-soc = { git = "https://github.com/joakimeriksson/fm1-emu.git", rev = "b7097fcc3e97eb7d1f6d5f46cee2ad6634f8538d" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Storage", "Window"] }
