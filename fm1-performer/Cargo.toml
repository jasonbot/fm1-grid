[package]
name = "fm1-performer"
version = "0.1.0"
edition = "2021"
description = "The UI-free FM-1 core: emulator client, firmware picker, MIDI keyboard and the facade over the shared crates"
license = "MIT"

[dependencies]
fm1-base = { path = "../fm1-base" }
fm1-firmware = { path = "../fm1-firmware" }
fm1-hardware = { path = "../fm1-hardware" }
# Optional per-emulator core pinning on Linux
libc = "0.2"
# The FM-1 CPU/SoC from the fm1-emu project.
fm1-core = { git = "https://github.com/joakimeriksson/fm1-emu.git", rev = "3e3fb27df91239fe0e7c5bbf82b14c20ad7dd62a" }
fm1-soc = { git = "https://github.com/joakimeriksson/fm1-emu.git", rev = "3e3fb27df91239fe0e7c5bbf82b14c20ad7dd62a" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
